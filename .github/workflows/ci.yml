name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bolo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.19.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  android:
    name: Unsigned Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.19.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install

      - name: Build Android debug app
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

  ios:
    name: Unsigned iOS simulator build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.19.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native project
        run: pnpm exec expo prebuild --platform ios --non-interactive --no-install

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -workspace ios/Bolo.xcworkspace
          -scheme Bolo
          -configuration Debug
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
          build
